# Connects to your ak_admin database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ak_admin}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# Tells Spring Boot to run our table creation script on startup
spring.sql.init.mode=always

# Server Port
server.port=5000

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}
google.gemini.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}